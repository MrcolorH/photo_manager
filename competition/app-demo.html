            </div>
          </div>
          <button class="btn primary lg" id="impStart">⤓ 开始导入</button>
        </div>`;
      bindRepoSelect(wrap, id => { state.selectedRepoId = id; refreshStorage(); });
      wrap.querySelector('#impAddRepo').onclick = () => openRepoModal(null, () => renderImportStep());
      wrap.querySelector('#impManageRepo').onclick = () => openRepoManageModal(() => renderImportStep());
      wrap.querySelector('#impSelectFolder').onclick = async () => {
        const res = await mockApi.selectFolder();
        if (!res.success) nativeUnavailable('系统文件夹选择对话框');
      };
      wrap.querySelector('#impPath').oninput = e => importState.sourcePath = e.target.value;
      wrap.querySelector('#impSmart').onchange = e => importState.smartNaming = e.target.checked;
      wrap.querySelector('#impStart').onclick = startImport;
    } else if (importState.step === 1) {
      renderImportProgress();
    } else if (importState.step === 2) {
      renderImportResult();
    }
  }

  let importTimer = null;
  async function startImport() {
    if (!importState.sourcePath.trim()) return toast('请输入存储卡路径', 'warning');
    importState.step = 1;
    importState.importing = true;
    renderImport();
    // 模拟 SSE 导入（真实后端通过 EventSource 推送）
    const res = await mockApi.importFromCard(
      importState.sourcePath, state.selectedRepoId, importState.smartNaming,
      (progress) => { updateImportProgress(progress); }
    );
    importTimer && clearInterval(importTimer);
    if (res.success) {
      importState.result = res.data;
      importState.step = 2;
      importState.importing = false;
      renderImportStep();
      refreshStorage();
      toast('导入完成！', 'success');
    }
  }

  function renderImportProgress() {
    const wrap = document.getElementById('importContent');
    wrap.innerHTML = `
      <div class="card" style="text-align:center;padding:48px 24px;">
        <div class="spinner" style="margin:0 auto 20px;"></div>
        <h3 style="margin-bottom:18px;">正在导入中...</h3>
        <div class="stat-row">
          <div class="stat-box"><div class="label">总文件数</div><div class="num" id="impTotal">0</div></div>
          <div class="stat-box"><div class="label">已处理</div><div class="num success" id="impDone">0</div></div>
          <div class="stat-box"><div class="label">剩余</div><div class="num accent" id="impRemain">0</div></div>
          <div class="stat-box"><div class="label">预计剩余</div><div class="num accent" id="impEta">0<small style="font-size:13px;color:var(--muted);font-weight:400;"> 分钟</small></div></div>
        </div>
        <div id="impCurFile" style="color:var(--muted);font-size:13px;margin-bottom:18px;min-height:20px;"></div>
        <div class="progress-track" style="max-width:600px;margin:0 auto;">
          <div class="progress-fill active" id="impBar"></div>
        </div>
        <div style="color:var(--muted);font-size:12px;margin-top:10px;" id="impPct">0%</div>
      </div>`;
  }
  function updateImportProgress(p) {
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.innerHTML = v; };
    set('impTotal', p.total);
    set('impDone', `<span style="color:var(--success);">${p.processed}</span>`);
    set('impRemain', p.remaining);
    set('impEta', `${p.estimatedTimeRemaining > 0 ? Math.ceil(p.estimatedTimeRemaining / 60) : (p.total > 0 ? '< 1' : 0)}<small style="font-size:13px;color:var(--muted);font-weight:400;"> 分钟</small>`);
    const cur = document.getElementById('impCurFile');
    if (cur) cur.innerHTML = p.currentFile ? `正在处理: <strong style="color:var(--text);">${escapeHtml(p.currentFile)}</strong>` : '';
    const bar = document.getElementById('impBar');
    if (bar) bar.style.width = p.percentage + '%';
    set('impPct', p.total === 0 ? (p.percentage === 100 ? '无文件' : '扫描中...') : `${p.percentage}% (${p.processed}/${p.total})`);
  }

  function renderImportResult() {
    const r = importState.result;
    const total = r.jpgCount + r.rawCount + r.videoCount;
    const wrap = document.getElementById('importContent');
    const sumCard = (label, count, color, icon) => `
      <div class="stat-box"><div class="label">${label}</div>
        <div class="num ${color}">${icon} ${count}<small style="font-size:13px;color:var(--muted);font-weight:400;"> ${label.includes('视频') ? '个' : '张'}</small></div>
      </div>`;
    wrap.innerHTML = `
      <div class="card">
        ${total === 0
          ? `<div class="alert warning"><span class="ico">⚠</span><div><div class="title">未找到可导入的文件</div><div class="desc">所选文件夹中没有找到支持的媒体文件（JPG、RAW、视频）</div></div></div>`
          : `<div class="alert success"><span class="ico">✓</span><div>
              <div class="title">${r.skippedCount > 0 ? `导入完成！新增 ${total} 个文件，跳过 ${r.skippedCount} 个已存在文件` : `导入完成！成功导入 ${total} 个文件`}</div>
              <div class="desc">文件已成功导入到仓库 <strong>${escapeHtml(r.targetRepo)}</strong></div>
            </div></div>`}
        <div class="stat-row" style="margin-top:8px;">
          ${sumCard('JPG 照片', r.jpgCount, 'success', '🖼')}
          ${sumCard('RAW 底片', r.rawCount, 'accent', '🎞')}
          ${sumCard('视频文件', r.videoCount, '', '🎬')}
        </div>
        ${r.skippedCount > 0 ? `<div class="alert info"><span class="ico">ℹ</span><div><div class="title">${r.skippedCount} 个文件已存在并被跳过</div><div class="desc">这些文件在目标位置已经存在，未进行覆盖操作</div></div></div>` : ''}
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button class="btn primary" id="impAgain">继续导入</button>
          <button class="btn" id="impGoGallery">去浏览照片</button>
        </div>
      </div>`;
    wrap.querySelector('#impAgain').onclick = () => { importState.step = 0; importState.result = null; importState.sourcePath = ''; renderImportStep(); };
    wrap.querySelector('#impGoGallery').onclick = () => go('gallery');
  }

  /* ============ 页面：同步删除 RAW ============ */
  const syncState = { orphanRaws: [], selected: [], loading: false, page: 1, pageSize: 20 };

  async function renderSyncDelete() {
    const c = document.getElementById('content');
    c.innerHTML = `
      <div class="page">
        <h2 class="page-title">同步删除 RAW 底片</h2>
        <div class="alert info"><span class="ico">ℹ</span><div>
          <div class="title">功能说明</div>
          <div class="desc">此功能用于删除那些没有对应 JPG 照片的 RAW 底片。当你在浏览 JPG 时删除了一些照片，对应的 RAW 文件就变成了"孤立"文件，可以在这里一键清理。</div>
        </div></div>
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-size:13px;color:var(--text-secondary);">选择存储仓库：</span>
            ${repoSelectHTML(state.selectedRepoId, 'id="syncRepo"')}
          </div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="stat-row" style="margin-bottom:0;">
            <div class="stat-box"><div class="label">孤立 RAW 文件</div><div class="num accent" id="syncTotal">0<small style="font-size:13px;color:var(--muted);"> 个</small></div></div>
            <div class="stat-box"><div class="label">已选择</div><div class="num" id="syncSel">0<small style="font-size:13px;color:var(--muted);"> 个</small></div></div>
            <div class="stat-box"><div class="label">选中文件大小</div><div class="num" id="syncSize" style="font-size:18px;">0 B</div></div>
            <div class="stat-box" style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;">
              <div style="display:flex;gap:10px;">
                <button class="btn" id="syncRefresh">↻ 刷新</button>
                <button class="btn danger" id="syncDel" disabled>🗑 删除选中</button>
              </div>
            </div>
          </div>
        </div>
        <div id="syncList"><div class="spinner"></div><div class="loading-text">正在扫描孤立 RAW 文件...</div></div>
      </div>`;
    bindRepoSelect(c, async id => { state.selectedRepoId = id; syncState.page = 1; await refreshStorage(); await fetchOrphanRaws(); });
    c.querySelector('#syncRefresh').onclick = fetchOrphanRaws;
    c.querySelector('#syncDel').onclick = openSyncDelete;
    await fetchOrphanRaws();
  }

  async function fetchOrphanRaws() {
    syncState.loading = true;
    syncState.selected = [];
    const wrap = document.getElementById('syncList');
    if (wrap) wrap.innerHTML = `<div class="spinner"></div><div class="loading-text">正在扫描孤立 RAW 文件...</div>`;
    const res = await mockApi.getOrphanRaws(state.selectedRepoId);
    syncState.loading = false;
    if (res.success) syncState.orphanRaws = res.data;
    renderSyncList();
  }

  function renderSyncList() {
    const total = syncState.orphanRaws.length;
    const totalPages = Math.max(1, Math.ceil(total / syncState.pageSize));
    if (syncState.page > totalPages) syncState.page = totalPages;
    const start = (syncState.page - 1) * syncState.pageSize;
    const pageItems = syncState.orphanRaws.slice(start, start + syncState.pageSize);

    document.getElementById('syncTotal').innerHTML = `${total}<small style="font-size:13px;color:var(--muted);"> 个</small>`;
    updateSyncStats();

    const wrap = document.getElementById('syncList');
    if (!total) {
      wrap.innerHTML = `<div class="card"><div class="empty"><div class="ico">✓</div><div>没有发现孤立的 RAW 文件</div><div style="font-size:12px;margin-top:6px;color:var(--muted);">所有 RAW 文件都有对应的 JPG 照片，无需清理</div></div></div>`;
      return;
    }
    const allChecked = pageItems.length > 0 && pageItems.every(p => syncState.selected.includes(p.id));
    wrap.innerHTML = `
      <div class="card">
        <div class="card-head">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);">
            <input type="checkbox" class="checkbox" id="syncAll" ${allChecked ? 'checked' : ''}> 全选（第 ${syncState.page} 页）
          </label>
        </div>
        <div class="orphan-list">
          ${pageItems.map(item => `
            <div class="orphan-item" data-id="${item.id}">
              <input type="checkbox" class="checkbox sync-check" data-id="${item.id}" ${syncState.selected.includes(item.id) ? 'checked' : ''}>
              <div class="orphan-thumb" data-id="${item.id}"><img src="${item.thumbnailUrl}" alt="${escapeHtml(item.name)}" onerror="this.src='images/raw-placeholder.svg'"></div>
              <div class="orphan-meta">
                <div class="name" data-id="${item.id}">${escapeHtml(item.name)}</div>
                <div class="path" title="${escapeHtml(item.path)}">${escapeHtml(item.path)}</div>
              </div>
              <span class="tag orange">${(item.extension || '.raw').toUpperCase().replace('.', '')}</span>
              <span class="tag">${formatSize(item.size)}</span>
            </div>`).join('')}
        </div>
        <div class="pagination" style="margin-top:14px;">
          <span class="pg-total">共 ${total} 个文件</span>
          <button class="pg-btn" data-page="${syncState.page - 1}" ${syncState.page === 1 ? 'disabled' : ''}>‹</button>
          <span class="pg-btn active">${syncState.page} / ${totalPages}</span>
          <button class="pg-btn" data-page="${syncState.page + 1}" ${syncState.page === totalPages ? 'disabled' : ''}>›</button>
        </div>
      </div>`;
    wrap.querySelector('#syncAll').onchange = e => {
      if (e.target.checked) pageItems.forEach(p => { if (!syncState.selected.includes(p.id)) syncState.selected.push(p.id); });
      else syncState.selected = syncState.selected.filter(id => !pageItems.some(p => p.id === id));
      renderSyncList();
    };
    wrap.querySelectorAll('.sync-check').forEach(ch => {
      ch.onchange = e => {
        const id = ch.dataset.id;
        if (e.target.checked) { if (!syncState.selected.includes(id)) syncState.selected.push(id); }
        else syncState.selected = syncState.selected.filter(x => x !== id);
        updateSyncStats();
        const allChecked = pageItems.every(p => syncState.selected.includes(p.id));
        wrap.querySelector('#syncAll').checked = allChecked;
      };
    });
    // 点击缩略图/名称 → 打开（演示提示）
    wrap.querySelectorAll('.orphan-thumb, .orphan-meta .name').forEach(el => {
      el.onclick = () => nativeUnavailable('在系统中打开此 RAW 文件');
    });
    wrap.querySelectorAll('.pg-btn[data-page]').forEach(b => {
      b.onclick = () => { const p = +b.dataset.page; if (p >= 1 && p <= totalPages) { syncState.page = p; renderSyncList(); } };
    });
  }

  function updateSyncStats() {
    const sel = syncState.selected;
    const size = syncState.orphanRaws.filter(o => sel.includes(o.id)).reduce((s, o) => s + o.size, 0);
    document.getElementById('syncSel').innerHTML = `${sel.length}<small style="font-size:13px;color:var(--muted);"> 个</small>`;
    document.getElementById('syncSize').textContent = formatSize(size);
    document.getElementById('syncDel').disabled = sel.length === 0;
  }

  function openSyncDelete() {
    const n = syncState.selected.length;
    if (!n) return toast('请先选择要删除的文件', 'warning');
    confirmModal({
      title: '确认删除', okText: '确认删除', okType: 'danger',
      content: `
        <p>确定要删除选中的 <strong style="color:var(--accent);">${n}</strong> 个 RAW 文件吗？</p>
        <div class="alert warning" style="margin-top:12px;"><span class="ico">⚠</span><div><div class="title">此操作不可恢复</div><div class="desc">删除后文件将被永久移除，请确保这些 RAW 文件确实不需要了</div></div></div>`,
      onOk: async () => {
        const res = await mockApi.batchDeleteRaws(syncState.selected, state.selectedRepoId);
        if (res.success) {
          toast(`成功删除 ${res.data.success.length} 个文件`, 'success');
          syncState.selected = [];
          await fetchOrphanRaws();
          await refreshStorage();
        } else toast('删除失败', 'error');
      }
    });
  }

  /* ============ 页面：仓库配置 ============ */
  function renderSettings() {
    const c = document.getElementById('content');
    c.innerHTML = `
      <div class="page">
        <h2 class="page-title">存储仓库配置</h2>
        <div class="alert info"><span class="ico">ℹ</span><div>
          <div class="title">仓库说明</div>
          <div class="desc">存储仓库是照片文件的存放目录，每个仓库包含 jpg、raw、video 三个子文件夹。<br>你可以创建多个仓库来分类管理不同相机或不同项目的照片。<br>默认仓库会作为照片浏览和导入的默认选择。</div>
        </div></div>
        <div class="card">
          <div class="card-head">
            <div class="card-title">🗂 仓库列表</div>
            <button class="btn primary" id="repoAdd">+ 添加仓库</button>
          </div>
          <div style="overflow-x:auto;">
            <table class="table">
              <thead><tr><th>仓库名称</th><th>存储路径</th><th style="width:240px;">操作</th></tr></thead>
              <tbody>
                ${REPOS.map(r => `
                  <tr data-id="${r.id}">
                    <td>
                      <span style="display:inline-flex;align-items:center;gap:8px;">
                        <span style="color:var(--accent);">🗂</span>
                        <strong>${escapeHtml(r.name)}</strong>
                        ${r.isDefault ? '<span class="tag blue">默认</span>' : ''}
                      </span>
                    </td>
                    <td><span class="mono">${escapeHtml(r.path)}</span></td>
                    <td>
                      ${!r.isDefault ? `<button class="btn link sm" data-act="default">设为默认</button>` : ''}
                      <button class="btn link sm" data-act="edit">编辑</button>
                      <button class="btn link danger sm" data-act="del">删除</button>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
    c.querySelector('#repoAdd').onclick = () => openRepoModal(null, renderSettings);
    c.querySelectorAll('tr[data-id]').forEach(tr => {
      const id = tr.dataset.id;
      const repo = REPOS.find(r => r.id === id);
      const setAct = tr.querySelector('[data-act="default"]');
      if (setAct) setAct.onclick = async () => { await mockApi.setDefaultRepo(id); toast('设置成功', 'success'); renderSettings(); refreshStorage(); };
      tr.querySelector('[data-act="edit"]').onclick = () => openRepoModal(repo, renderSettings);
      tr.querySelector('[data-act="del"]').onclick = () => {
        confirmModal({
          title: '确认删除', okText: '删除', okType: 'danger',
          content: `<p>确定要删除仓库 <strong style="color:var(--accent);">${escapeHtml(repo.name)}</strong> 吗？</p>
                    <div class="form-hint" style="margin-top:8px;">注意：这不会删除实际文件，只是移除配置。</div>`,
          onOk: async () => {
            await mockApi.deleteRepo(id);
            if (state.selectedRepoId === id) state.selectedRepoId = REPOS[0]?.id;
            toast('删除成功', 'success');
            renderSettings();
            refreshStorage();
          }
        });
      };
    });
  }

  // 添加 / 编辑仓库弹窗
  function openRepoModal(repo, onClose) {
    const isEdit = !!repo;
    const body = `
      <label class="form-label">仓库名称</label>
      <input class="input" id="rmName" placeholder="例如：索尼照片库、工作项目A" value="${repo ? escapeHtml(repo.name) : ''}" style="width:100%;margin-bottom:16px;">
      <label class="form-label">存储路径 <span style="color:var(--muted);font-weight:400;">（路径不存在会自动创建）</span></label>
      <div class="input-group">
        <input class="input" id="rmPath" placeholder="例如：/Users/colorh/Pictures/索尼照片" value="${repo ? escapeHtml(repo.path) : ''}">
        <button class="btn" id="rmSelect">📂 选择文件夹</button>
      </div>
      <div class="form-hint">点击"选择文件夹"按钮打开系统对话框，自动获取完整路径</div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;">
        <input type="checkbox" class="checkbox" id="rmDefault" ${repo?.isDefault ? 'checked' : ''}> 设为默认仓库
      </label>`;
    const foot = `<button class="btn" data-act="cancel">取消</button><button class="btn primary" data-act="ok">${isEdit ? '保存' : '添加'}</button>`;
    const { mask, close } = openModal({ title: isEdit ? '编辑仓库' : '添加仓库', body, foot, width: 520 });
    mask.querySelector('[data-act="cancel"]').onclick = close;
    mask.querySelector('#rmSelect').onclick = async () => {
      const res = await mockApi.selectFolder();
      if (!res.success) nativeUnavailable('系统文件夹选择对话框');
    };
    mask.querySelector('[data-act="ok"]').onclick = async () => {
      const name = mask.querySelector('#rmName').value.trim();
      const path = mask.querySelector('#rmPath').value.trim();
      const isDefault = mask.querySelector('#rmDefault').checked;
      if (!name) return toast('请输入仓库名称', 'warning');
      if (!path) return toast('请输入存储路径', 'warning');
      if (isEdit) { await mockApi.deleteRepo(repo.id); }
      await mockApi.addRepo({ name, path, isDefault });
      toast(isEdit ? '修改成功' : '添加成功', 'success');
      close();
      if (onClose) onClose();
      refreshStorage();
    };
  }

  // 仓库管理弹窗（导入页用）
  function openRepoManageModal(onClose) {
    const body = `
      <div style="overflow-x:auto;">
        <table class="table">
          <thead><tr><th>名称</th><th>路径</th><th style="width:200px;">操作</th></tr></thead>
          <tbody>
            ${REPOS.map(r => `
              <tr data-id="${r.id}">
                <td><span style="display:inline-flex;align-items:center;gap:6px;">🗂 ${escapeHtml(r.name)} ${r.isDefault ? '<span class="tag blue">默认</span>' : ''}</span></td>
                <td><span class="mono">${escapeHtml(r.path)}</span></td>
                <td>
                  ${!r.isDefault ? `<button class="btn link sm" data-act="default">设为默认</button>` : ''}
                  <button class="btn link danger sm" data-act="del">删除</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    const { mask, close } = openModal({ title: '管理存储仓库', body, width: 680 });
    mask.querySelectorAll('tr[data-id]').forEach(tr => {
      const id = tr.dataset.id;
      const d = tr.querySelector('[data-act="del"]');
      const def = tr.querySelector('[data-act="default"]');
      if (def) def.onclick = async () => { await mockApi.setDefaultRepo(id); toast('设置成功', 'success'); close(); if (onClose) onClose(); refreshStorage(); };
      if (d) d.onclick = async () => {
        if (REPOS.length <= 1) return toast('至少保留一个仓库', 'warning');
        await mockApi.deleteRepo(id);
        if (state.selectedRepoId === id) state.selectedRepoId = REPOS[0]?.id;
        toast('删除成功', 'success');
        close(); if (onClose) onClose(); refreshStorage();
      };
    });
  }

  /* ============ ⑤ 路由 & 初始化 ============ */
  function go(route) {
    state.route = route;
    renderNav();
    closeAllOverlays();
    if (route === 'gallery') renderGallery();
    else if (route === 'import') renderImport();
    else if (route === 'sync-delete') renderSyncDelete();
    else if (route === 'settings') renderSettings();
  }
  function closeAllOverlays() {
    document.getElementById('modal-root').innerHTML = '';
  }

  // 主题切换
  document.getElementById('themeToggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeToggle').textContent = next === 'dark' ? '☀' : '☾';
    try { localStorage.setItem('shiguang-theme', next); } catch (e) {}
  };
  // 恢复主题
  try {
    const saved = localStorage.getItem('shiguang-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀' : '☾';
    }
  } catch (e) {}

  // 全局点击关闭下拉
  document.addEventListener('click', closeDropdowns);

  // 启动
  (async function init() {
    renderNav();
    await refreshStorage();
    go('gallery');
  })();
  </script>
</body>
</html>

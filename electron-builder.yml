appId: com.shiguang.capsule
productName: 拾光舱
artifactName: "Shiguang Capsule-${version}.${ext}"
copyright: Copyright © 2026 拾光舱

directories:
  output: dist-electron
  buildResources: electron/assets

# ===== Windows =====
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/assets/app-icon.ico

nsis:
  artifactName: "Shiguang Capsule Setup ${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 拾光舱

# ===== macOS =====
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: electron/assets/app-icon.png
  category: public.app-category.photography

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

files:
  - "electron/**/*"
  - "backend/src/**/*"
  - "backend/node_modules/**/*"
  - "backend/package.json"
  - "backend/data/**/*"
  - "frontend/dist/**/*"
  - "!**/*.map"
  - "!**/node_modules/.cache/**"
  - "!**/node_modules/*/test/**"
  - "!**/node_modules/*/tests/**"
  - "!**/node_modules/*/.github/**"
  - "!**/node_modules/*/docs/**"

extraResources:
  - from: "resources/ffmpeg.exe"
    to: "ffmpeg.exe"
  - from: "resources/ffmpeg"
    to: "ffmpeg"
    filter:
      - "**/*"

asar: false
